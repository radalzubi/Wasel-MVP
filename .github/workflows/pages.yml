name: Deploy pitchdeck to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The deploy steps fail with "Get Pages site failed ... Not Found" until Pages
      # is switched on for the repository, so check first and explain what to do.
      - name: Check that GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages is not enabled::Skipping the pitch deck deploy. Enable it under Settings > Pages > Build and deployment > Source: GitHub Actions, then re-run this workflow."
          fi
      - uses: actions/checkout@v4
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/configure-pages@v4
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: pitchdeck/
      - uses: actions/deploy-pages@v4
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
